name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: ap-northeast-2   # change to your ECR/EC2 region
  BACKEND_REPO: inindramaclub-backend
  FRONTEND_REPO: inindramaclub-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$BACKEND_REPO:$TAG" -t "$REGISTRY/$BACKEND_REPO:latest" ./backend
          docker push "$REGISTRY/$BACKEND_REPO:$TAG"
          docker push "$REGISTRY/$BACKEND_REPO:latest"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -t "$REGISTRY/$FRONTEND_REPO:$TAG" -t "$REGISTRY/$FRONTEND_REPO:latest" ./frontend
          docker push "$REGISTRY/$FRONTEND_REPO:$TAG"
          docker push "$REGISTRY/$FRONTEND_REPO:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/inindramaclub"

      - name: Pull and restart containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,IMAGE_TAG,REGISTRY
          script: |
            cd ~/inindramaclub
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ needs.build-and-push.outputs.registry }}
            export ECR_REGISTRY=${{ needs.build-and-push.outputs.registry }}
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
